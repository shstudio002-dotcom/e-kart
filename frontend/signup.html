<!-- frontend/signup.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MF Dari Grocery - Customer Signup</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body class="bg-gray-100 text-gray-900 min-h-screen flex items-center justify-center p-4 antialiased">
  <div class="max-w-md w-full bg-white rounded-2xl shadow-sm border border-gray-200 p-6 sm:p-8 space-y-6">
    <div class="text-center space-y-2">
      <div class="w-12 h-12 bg-green-500 text-gray-950 rounded-2xl mx-auto flex items-center justify-center font-black text-xl shadow-sm">
        <i class="fa-solid fa-user-plus"></i>
      </div>
      <h1 class="text-xl font-black tracking-tight">Create Account</h1>
      <p class="text-xs text-gray-500 font-mono">Sign up to start ordering fresh groceries</p>
    </div>

    <form id="signup-form" class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1">Full Name</label>
        <input type="text" id="signup-name" required class="w-full px-3.5 py-2.5 rounded-xl border border-gray-300 text-sm focus:outline-none focus:ring-2 focus:ring-green-500" placeholder="John Doe" />
      </div>
      <div>
        <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1">Mobile Number</label>
        <input type="tel" id="signup-mobile" required class="w-full px-3.5 py-2.5 rounded-xl border border-gray-300 text-sm focus:outline-none focus:ring-2 focus:ring-green-500" placeholder="9876543210" />
      </div>
      <div>
        <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1">Password</label>
        <input type="password" id="signup-password" required class="w-full px-3.5 py-2.5 rounded-xl border border-gray-300 text-sm focus:outline-none focus:ring-2 focus:ring-green-500" placeholder="••••••••" />
      </div>
      <button type="submit" class="w-full py-3 rounded-xl bg-green-600 hover:bg-green-500 active:scale-95 text-white font-bold text-sm shadow-sm transition cursor-pointer">
        Register Account
      </button>
    </form>

    <div class="text-center text-xs text-gray-500">
      Already have an account? <a href="login.html" class="text-green-700 font-bold hover:underline">Sign In</a>
    </div>
  </div>

  <!-- Connect centralized api.js -->
  <script src="api.js"></script>

  <script>
    document.getElementById('signup-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('signup-name').value.trim();
      const mobile = document.getElementById('signup-mobile').value.trim();
      const password = document.getElementById('signup-password').value;

      try {
        const data = await GroceryAPI.signup(name, mobile, password);
        localStorage.setItem('mfd_user', JSON.stringify(data.user));
        alert('Registration successful!');
        
        if (data.user.role === 'admin') {
          window.location.href = './admin/admin.html';
        } else {
          window.location.href = 'index.html';
        }
      } catch (err) {
        alert(err.message || 'Network error connecting to server.');
      }
    });
  </script>
</body>
</html>
