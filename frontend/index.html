<!-- frontend/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MF Dari Grocery - Home (Catalog)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+Kannada:wght@400;600;700;800&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'Noto Sans Kannada', 'sans-serif']
          }
        }
      }
    }
  </script>

  <style>
    body {
      font-family: 'Inter', 'Noto Sans Kannada', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar { height: 6px; width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    @keyframes marquee {
      0% { transform: translateX(100%); }
      100% { transform: translateX(-100%); }
    }
    .animate-marquee {
      display: inline-block;
      white-space: nowrap;
      animation: marquee 15s linear infinite;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 pb-36 min-h-screen flex flex-col antialiased">

  <!-- Authentication Check Gate: Redirects to login if not authenticated -->
  <script>
    const authUser = JSON.parse(localStorage.getItem('mfd_user'));
    if (!authUser) {
      window.location.href = 'login.html';
    }
  </script>

  <!-- Top Announcement Bar -->
  <div class="bg-gradient-to-r from-emerald-800 via-emerald-700 to-teal-800 text-white px-3 py-2 text-xs font-medium sticky top-0 z-40 shadow-xs">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-1.5 truncate">
        <span class="relative flex h-2 w-2">
          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-amber-400 opacity-75"></span>
          <span class="relative inline-flex rounded-full h-2 w-2 bg-amber-400"></span>
        </span>
        <span class="truncate"><strong class="text-amber-300">Get grocery in 1 day</strong> • Under 1 day guaranteed</span>
      </div>
      <span class="bg-black/30 px-2 py-0.5 rounded text-[10px] font-mono whitespace-nowrap ml-2 flex items-center gap-1">
        <i class="fa-solid fa-store text-amber-300"></i> Shivamogga Hub
      </span>

    </div>
  </div>

  <!-- Header -->
  <header class="bg-white border-b border-slate-200 sticky top-8 z-30 shadow-xs">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-2.5">
        <div class="w-10 h-10 bg-emerald-600 text-white rounded-xl flex items-center justify-center shadow-md shadow-emerald-200">
          <i class="fa-solid fa-basket-shopping text-lg"></i>
        </div>
        <div>
          <div class="flex items-center gap-1.5">
            <h1 class="text-base sm:text-lg font-black tracking-tight leading-none text-slate-900">MF Dari Grocery</h1>
            <span class="text-[10px] font-bold text-emerald-700 bg-emerald-50 px-1.5 py-0.5 rounded border border-emerald-200 leading-none">ಆಹಾರ ತಾಣ</span>
          </div>
          <p class="text-[11px] text-slate-500 font-medium">Daily Fresh & Farm Direct Supplies</p>
        </div>
      </a>

      <!-- User Greeting & Logout -->
      <div class="flex items-center gap-3">
        <span id="nav-user-greeting" class="text-xs font-bold text-slate-700 hidden sm:inline-block"></span>
        <button onclick="handleLogout()" class="px-3 py-1.5 rounded-xl text-xs font-semibold bg-slate-100 hover:bg-slate-200 text-slate-700 transition flex items-center gap-1.5 cursor-pointer">
          <i class="fa-solid fa-right-from-bracket text-xs"></i><span>Logout</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content Container (Always Full Width Now) -->
  <main class="max-w-7xl mx-auto px-3 sm:px-6 py-4 flex-grow w-full">
    <div class="space-y-4">
      
      <!-- Dynamic Offer Banner Controlled via Backend with Video Background -->
      <div class="relative overflow-hidden rounded-2xl bg-emerald-950 text-white p-4 sm:p-6 shadow-md">
        <!-- Video Background Layer -->
        <video autoplay muted loop playsinline class="absolute inset-0 w-full h-full object-cover opacity-50 pointer-events-none">
          <source src="images/ai video.mp4" type="video/mp4">
        </video>

        <div class="relative z-10 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3">
          <div class="space-y-1 overflow-hidden w-full sm:w-2/3">
            <span id="cust-banner-tag" class="text-[10px] font-black uppercase tracking-wider bg-amber-400 text-slate-950 px-2 py-0.5 rounded-md inline-block"></span>
            
            <div class="overflow-hidden whitespace-nowrap py-1">
              <div class="animate-marquee inline-flex items-center gap-6">
                <h2 id="cust-banner-title" class="text-xl sm:text-2xl font-black text-amber-300"></h2>
              </div>
            </div>

            <p id="cust-banner-subtitle" class="text-xs text-emerald-100"></p>
          </div>
          <div class="bg-black/40 backdrop-blur-md px-3 py-2 rounded-xl border border-white/20 text-center flex items-center gap-3 self-stretch sm:self-auto justify-around shrink-0">
            <div>
              <span id="cust-banner-fee" class="block text-base sm:text-lg font-black text-amber-300"></span>
              <span class="text-[10px] text-emerald-100 uppercase">Delivery</span>
            </div>
            <div class="h-6 w-px bg-white/20"></div>
            <div>
              <span id="cust-banner-speed" class="block text-base sm:text-lg font-black text-white">35m</span>
              <span class="text-[10px] text-emerald-100 uppercase">Speed</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Search and Category Filters -->
      <div class="bg-white p-3 sm:p-4 rounded-2xl border border-slate-200 shadow-xs space-y-3">
        <div class="relative">
          <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
          <input 
            type="text" 
            id="search-input" 
            oninput="handleSearch(this.value)" 
            placeholder="Search of all (ಅಕ್ಕಿ, Rice, Dal, Eggs, Sugar, Oil...)" 
            class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs sm:text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-emerald-500 transition"
          />
        </div>

        <div class="flex items-center gap-2 overflow-x-auto no-scrollbar text-xs">
          <button onclick="setCategory('all', this)" class="cat-pill whitespace-nowrap px-3.5 py-1.5 rounded-xl font-bold bg-emerald-600 text-white shadow-xs transition">All Items</button>
          <button onclick="setCategory('grains', this)" class="cat-pill whitespace-nowrap px-3.5 py-1.5 rounded-xl font-semibold bg-slate-100 text-slate-700 hover:bg-slate-200 transition">Grains & Pulses</button>
          <button onclick="setCategory('dairy', this)" class="cat-pill whitespace-nowrap px-3.5 py-1.5 rounded-xl font-semibold bg-slate-100 text-slate-700 hover:bg-slate-200 transition">Dairy & Eggs</button>
          <button onclick="setCategory('staples', this)" class="cat-pill whitespace-nowrap px-3.5 py-1.5 rounded-xl font-semibold bg-slate-100 text-slate-700 hover:bg-slate-200 transition">Staples & Oils</button>
        </div>
      </div>

      <!-- Product Catalog Section -->
      <div class="bg-white rounded-2xl border border-slate-200 shadow-xs p-4 sm:p-5 space-y-4">
        <div class="flex items-center justify-between border-b border-slate-100 pb-3">
          <div>
            <h3 class="text-sm sm:text-base font-bold text-slate-900 flex items-center gap-2">
              <i class="fa-solid fa-boxes-stacked text-emerald-600"></i> Grocery Catalog (ಆಹಾರ ಪದಾರ್ಥಗಳು)
            </h3>
            <p class="text-[11px] text-slate-500">Click on any product to add to your order</p>
          </div>
          <span class="text-[11px] font-semibold bg-emerald-50 text-emerald-700 px-2.5 py-1 rounded-full border border-emerald-200">
            <span id="items-count">0</span> Items Available
          </span>

        </div>

        <!-- Product Grid View -->
        <div id="catalog-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3">
          <!-- Dynamically populated via backend -->
        </div>
      </div>

    </div>
  </main>

  <!-- Floating Quick Cart Bar (Replaces Split Screen View) -->
  <div id="floating-cart-bar" class="fixed bottom-16 left-3 right-3 sm:left-auto sm:right-6 sm:w-96 z-50 transition-all duration-300 transform translate-y-24 opacity-0 pointer-events-none">
    <div class="bg-slate-900 text-white rounded-2xl shadow-2xl p-4 border border-slate-800 flex items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <div class="w-11 h-11 bg-emerald-600 text-white rounded-xl flex items-center justify-center font-bold text-base shadow-md shadow-emerald-900/50 relative">
          <i class="fa-solid fa-cart-shopping"></i>
          <span id="float-total-items-badge" class="absolute -top-1.5 -right-1.5 bg-amber-400 text-slate-950 text-[10px] font-black px-1.5 py-0.2 rounded-full border border-slate-900">0</span>
        </div>
        <div>
          <p class="text-[10px] text-slate-400 uppercase font-semibold">Total Amount</p>
          <h4 id="float-grand-total" class="text-base sm:text-lg font-black text-amber-300 leading-none">₹0</h4>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="clearCatalogSelection()" class="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold rounded-xl text-xs transition cursor-pointer">
          <i class="fa-solid fa-trash text-rose-400"></i>
        </button>
        <button onclick="addCatalogToCartAndRedirect()" class="px-4 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl text-xs transition flex items-center gap-1.5 shadow-lg shadow-emerald-900/40 cursor-pointer">
          <span>View Cart & Checkout</span> <i class="fa-solid fa-arrow-right"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- Universal Bottom Navigation Bar -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 z-40 shadow-xl py-2.5">
    <div class="max-w-xl mx-auto grid grid-cols-4 px-3 items-center gap-2 text-center">
      <a href="index.html" class="flex flex-col items-center justify-center py-1 text-green-700 font-bold text-xs bg-green-50 rounded-xl">
        <span class="text-base leading-none">🏠</span><span class="mt-1">Home</span>
      </a>
      <a href="cart.html" class="flex flex-col items-center justify-center py-1 text-gray-600 hover:text-green-700 font-semibold text-xs">
        <span class="text-base leading-none">🛒</span><span class="mt-1">Cart</span>
      </a>
      <a href="orders.html" class="flex flex-col items-center justify-center py-1 text-gray-600 hover:text-green-700 font-semibold text-xs">
        <span class="text-base leading-none">📦</span><span class="mt-1">Orders</span>
      </a>
      <a href="profile.html" class="flex flex-col items-center justify-center py-1 text-gray-600 hover:text-green-700 font-semibold text-xs">
        <span class="text-base leading-none">👤</span><span class="mt-1">Profile</span>
      </a>
    </div>
  </nav>

  <!-- External API Bridge -->
  <script src="api-config.js"></script>
  <script src="api.js"></script>

  <script>
    let products = [];
    let currentCategory = 'all';
    let searchQuery = '';

    // Display user greeting if available
    const currentUser = JSON.parse(localStorage.getItem('mfd_user'));
    if (currentUser && currentUser.name) {
      const greetingEl = document.getElementById('nav-user-greeting');
      if (greetingEl) {
        greetingEl.textContent = `Hello, ${currentUser.name}`;
      }
    }

    function handleLogout() {
      localStorage.removeItem('mfd_user');
      window.location.href = 'login.html';
    }

    // Initial Load via api.js
    async function initCatalog() {
      const liveOffer = await GroceryAPI.getOffer();
      if (liveOffer) {
        document.getElementById('cust-banner-tag').textContent = liveOffer.tag || 'OFFER OF ANY';
        document.getElementById('cust-banner-title').textContent = liveOffer.title || 'Flat 20% OFF Daily Groceries!';
        document.getElementById('cust-banner-subtitle').textContent = liveOffer.subtitle || 'Fresh farm staples, rice, dairy & organic produce delivered in 30-40 mins.';
        document.getElementById('cust-banner-fee').textContent = liveOffer.deliveryFee || '₹0';
        document.getElementById('cust-banner-speed').textContent = liveOffer.speed || '35m';
      }

      const backendProducts = await GroceryAPI.getProducts();
      products = (backendProducts || []).map(p => ({
        ...p,
        id: p._id || p.id,
        unitOptions: (p.unitOptions && p.unitOptions.length > 0) ? p.unitOptions : [
          { label: '100 gm', multiplier: 0.1 },
          { label: '250 gm', multiplier: 0.25 },
          { label: '500 gm', multiplier: 0.5 },
          { label: '1 kg', multiplier: 1.0 },
          { label: '2 kg', multiplier: 2.0 },
          { label: '5 kg', multiplier: 5.0 },
          { label: '10 kg', multiplier: 10.0 }
        ],
        selectedUnitIndex: p.selectedUnitIndex !== undefined ? p.selectedUnitIndex : 3, // Defaults to 1 kg
        quantity: 0
      }));

      renderCatalog();
      updateFloatingCartBar();
    }

    function getItemPrice(prod) {
      const unit = prod.unitOptions[prod.selectedUnitIndex] || { multiplier: 1.0 };
      return Math.round(prod.basePriceKg * unit.multiplier);
    }

    function calculateCatalogTotal() {
      return products.reduce((acc, p) => {
        return acc + (p.quantity > 0 ? (getItemPrice(p) * p.quantity) : 0);
      }, 0);
    }

    function renderCatalog() {
      const grid = document.getElementById('catalog-grid');
      grid.innerHTML = '';

      const filtered = products.filter(p => {
        const matchesCat = (currentCategory === 'all' || p.category === currentCategory);
        const matchesSearch = p.nameEng.toLowerCase().includes(searchQuery.toLowerCase()) || 
                            p.nameKan.toLowerCase().includes(searchQuery.toLowerCase());
        return matchesCat && matchesSearch;
      });

      document.getElementById('items-count').textContent = filtered.length;

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full py-12 text-center text-slate-400 text-xs">
            <i class="fa-solid fa-magnifying-glass text-2xl mb-1 text-slate-300 block"></i>
            No groceries found matching "${searchQuery}".
          </div>
        `;
        updateFloatingCartBar();
        return;
      }

      filtered.forEach(p => {
        const currentPrice = getItemPrice(p);
        const card = document.createElement('div');
        card.className = `bg-white rounded-2xl border ${p.quantity > 0 ? 'border-emerald-500 ring-1 ring-emerald-500 shadow-sm' : 'border-slate-200 hover:border-slate-300'} p-3 flex flex-col justify-between transition-all duration-150`;

        const imageHtml = p.image 
          ? `<img src="${p.image}" alt="${p.nameEng}" class="w-full h-full object-cover rounded-xl" />`
          : `<i class="fa-solid fa-basket-shopping opacity-20 absolute"></i>
             <i class="fa-solid fa-leaf text-emerald-600 relative z-10 text-2xl"></i>`;

        card.innerHTML = `
          <div>
            <div class="w-full h-28 bg-slate-100 rounded-xl mb-2.5 flex items-center justify-center text-emerald-600 text-3xl font-bold relative overflow-hidden">
              ${imageHtml}
            </div>
            <h4 class="font-bold text-slate-900 text-xs sm:text-sm leading-tight line-clamp-1">${p.nameKan}</h4>
            <p class="text-[10px] text-slate-500 leading-tight mb-2 line-clamp-1">${p.nameEng}</p>
            
            <div class="mb-2">
              <select 
                onchange="changeProductUnit('${p.id}', this.value)" 
                class="w-full bg-slate-50 border border-slate-200 text-[11px] rounded-lg px-2 py-1 font-medium text-slate-700 focus:ring-1 focus:ring-emerald-500 focus:outline-none cursor-pointer"
              >
                ${p.unitOptions.map((u, idx) => `
                  <option value="${idx}" ${idx === p.selectedUnitIndex ? 'selected' : ''}>
                    ${u.label}
                  </option>
                `).join('')}
              </select>
            </div>
          </div>

          <div>
            <div class="flex items-center justify-between mb-2">
              <span class="text-xs font-black text-slate-900">₹${currentPrice}</span>
              <span class="text-[10px] text-slate-400">Base</span>
            </div>

            ${p.quantity === 0 ? `
              <button 
                onclick="updateQuantity('${p.id}', 1)" 
                class="w-full py-2 bg-emerald-50 hover:bg-emerald-600 hover:text-white text-emerald-700 font-bold rounded-xl text-xs transition flex items-center justify-center gap-1.5 border border-emerald-200 cursor-pointer"
              >
                <i class="fa-solid fa-plus text-[10px]"></i> Add
              </button>
            ` : `
              <div class="flex items-center justify-between border border-emerald-300 bg-emerald-50/50 rounded-xl p-1">
                <button 
                  onclick="updateQuantity('${p.id}', -1)" 
                  class="w-7 h-7 flex items-center justify-center rounded-lg bg-white hover:bg-slate-100 text-slate-700 font-bold shadow-2xs transition text-xs cursor-pointer"
                >
                  <i class="fa-solid fa-minus"></i>
                </button>
                <span class="text-xs font-black text-emerald-900">${p.quantity}</span>
                <button 
                  onclick="updateQuantity('${p.id}', 1)" 
                  class="w-7 h-7 flex items-center justify-center rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white font-bold shadow-2xs transition text-xs cursor-pointer"
                >
                  <i class="fa-solid fa-plus"></i>
                </button>
              </div>
            `}
          </div>
        `;
        grid.appendChild(card);
      });

      updateFloatingCartBar();
    }

    function updateFloatingCartBar() {
      const selected = products.filter(p => p.quantity > 0);
      const floatBar = document.getElementById('floating-cart-bar');

      if (selected.length > 0) {
        const totalItemsCount = selected.reduce((sum, p) => sum + p.quantity, 0);
        const grandTotal = calculateCatalogTotal();

        document.getElementById('float-total-items-badge').textContent = totalItemsCount;
        document.getElementById('float-grand-total').textContent = `₹${grandTotal}`;

        // Smooth slide-up transition animation
        floatBar.classList.remove('translate-y-24', 'opacity-0', 'pointer-events-none');
        floatBar.classList.add('translate-y-0', 'opacity-100', 'pointer-events-auto');
      } else {
        // Smooth slide-down transition animation
        floatBar.classList.remove('translate-y-0', 'opacity-100', 'pointer-events-auto');
        floatBar.classList.add('translate-y-24', 'opacity-0', 'pointer-events-none');
      }
    }

    function changeProductUnit(prodId, unitIndex) {
      const prod = products.find(p => p.id === prodId);
      if (prod) {
        prod.selectedUnitIndex = parseInt(unitIndex, 10);
        renderCatalog();
      }
    }

    function updateQuantity(prodId, change) {
      const prod = products.find(p => p.id === prodId);
      if (prod) {
        prod.quantity = Math.max(0, prod.quantity + change);
        renderCatalog();
      }
    }

    function clearCatalogSelection() {
      products.forEach(p => p.quantity = 0);
      renderCatalog();
    }

    function handleSearch(query) {
      searchQuery = query;
      renderCatalog();
    }

    function setCategory(cat, btn) {
      currentCategory = cat;
      document.querySelectorAll('.cat-pill').forEach(b => {
        b.className = 'cat-pill whitespace-nowrap px-3.5 py-1.5 rounded-xl font-semibold bg-slate-100 text-slate-700 hover:bg-slate-200 transition';
      });
      btn.className = 'cat-pill whitespace-nowrap px-3.5 py-1.5 rounded-xl font-bold bg-emerald-600 text-white shadow-xs transition';
      renderCatalog();
    }

    function addCatalogToCartAndRedirect() {
      const selected = products.filter(p => p.quantity > 0);
      if (selected.length === 0) {
        alert('Please select at least 1 item with quantity > 0 before proceeding.');
        return;
      }

      const cartSnapshot = selected.map(p => {
        const unit = p.unitOptions[p.selectedUnitIndex] || { label: '1 kg' };
        const price = getItemPrice(p);
        return {
          productId: p.id,
          name: `${p.nameKan} (${p.nameEng})`,
          unit: unit.label,
          qty: p.quantity,
          price: price,
          subtotal: price * p.quantity
        };
      });

      localStorage.setItem('mfd_cart', JSON.stringify(cartSnapshot));
      window.location.href = 'cart.html';
    }

    window.addEventListener('DOMContentLoaded', initCatalog);
  </script>
</body>
</html>
